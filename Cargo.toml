[package]
name = "ged_io"
version = "0.17.0"
authors = [
    "Robert Pirtle <astropirtle@gmail.com>",
    "Jacob Benison <ge3224@gmail.com>",
    "Pierre Erraud <trois.six+github@ik.me>",
    "n4n5 <its.just.n4n5@gmail.com>",
]
description = "A parser for GEDCOM files"
keywords = ["genealogy", "gedcom", "parser", "family-trees"]
categories = ["parser-implementations", "data-structures"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/ge3224/ged_io"
edition = "2021"
rust-version = "1.88"
include = ["Cargo.toml", "src/**/*.rs", "license.md", "NOTICE", "/README.md", "/MIGRATION.md", "/CHANGELOG.md"]

[features]
default = []
serde = ["dep:serde"]
gedzip = ["dep:zip"]
calendar = ["dep:calendrical_calculations", "dep:calendrier"]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
zip = { version = "8.5", optional = true, default-features = false, features = ["deflate"] }
calendrical_calculations = { version = "0.2", optional = true }
# `default-features = false` drops calendrier's chrono bridge: its conversions apply a
# Paris-versus-Greenwich clock offset, and we convert through Republican day counts instead.
calendrier = { version = "1.0", optional = true, default-features = false }

[dev-dependencies]
serde_json = "1.0"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "read"
harness = false

[[bench]]
name = "write"
harness = false

[[bench]]
name = "memory"
harness = false

[lib]
name = "ged_io"
path = "src/lib.rs"

[[bin]]
name = "ged-io"
path = "src/bin/ged-io.rs"
