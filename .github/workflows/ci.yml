# .github/workflows/ci.yml
name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, beta, nightly]

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Check formatting
      run: |
        cargo fmt --all -- --check
        cargo fmt --manifest-path fuzz/Cargo.toml -- --check

    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Run tests
      run: cargo test --all-features --verbose


  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Install Rust 1.88
      uses: dtolnay/rust-toolchain@1.88

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-msrv-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Run tests at the minimum supported Rust version
      run: cargo test --all-features

  features:
    name: Each feature alone
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-hack
      uses: taiki-e/install-action@cargo-hack

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-hack-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Build and test each feature on its own, and none
      run: cargo hack test --each-feature

  cross-platform-test:
    name: Cross Platform Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Build
      run: cargo build --release --verbose

    - name: Run tests
      run: cargo test --release --verbose

  memory:
    name: Peak memory and throughput (Linux)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          tools/perf/target
        key: ${{ runner.os }}-perf-cargo-${{ hashFiles('**/Cargo.lock', 'tools/perf/Cargo.toml') }}

    - name: Build the performance tool
      run: cargo build --release --manifest-path tools/perf/Cargo.toml

    # Each pipeline runs in a process of its own and reads its peak
    # resident set (VmHWM): a dataset read peaks at most at 3 times the
    # input, its write at 4.5, a stream at 64 MiB; see tools/perf.
    - name: Check peak memory and throughput on a generated 47 MB file
      run: |
        tools/perf/target/release/ged_io-perf generate 100000 "$RUNNER_TEMP/generated.ged"
        tools/perf/target/release/ged_io-perf check "$RUNNER_TEMP/generated.ged"

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Run security audit
      uses: rustsec/audit-check@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

  trigger-release:
    name: Trigger Release
    needs: [test, msrv, features, cross-platform-test, memory, security-audit]
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/release.yml
